services:
  station:
    # 预构建镜像，多架构（amd64 / arm64）。
    # 想自己构建就把 image 换成 build: . 然后 docker compose up -d --build
    image: ghcr.io/pancras-loe/115-station:latest
    container_name: 115-station
    restart: unless-stopped
    stop_grace_period: 20s   # 优雅退出窗口：SIGTERM 后程序需要 ~3 秒收尾（停 worker、冲刷通知）
    ports:
      - "6060:6060"   # 管理后台
      - "6086:6086"   # 302 直链代理
    volumes:
      - ./config:/config
      - ./data:/data
      - ./media:/media
      - ./logs:/logs
    environment:
      - TZ=Asia/Shanghai
      - AUTH_USER=admin              # 管理后台账号（环境变量管理，网页注册已移除）
      - AUTH_PASSWORD=change-me      # 改成强密码后 up -d 重启生效
      # - ACCESS_TOKEN_EXPIRE_MINUTES=11520  # 登录有效期（分钟），默认 8 天，同 MoviePilot
      # - AUTH_OTP_RESET=true        # 丢了二步验证器时临时加上重启一次，登录后去掉
