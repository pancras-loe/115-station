name: Build Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: 115-station
  # 是否把镜像推到 ghcr。false 时 docker job 只验证多架构构建能过，不产出可拉取的包。
  #
  # 上游 DaisyYijin/STRMhub 未附带 LICENSE，镜像内含其代码，同样适用该状况——
  # 说明写在 README「许可证与再分发声明」一节，本仓库不对镜像作出任何授权声明。
  PUBLISH: 'true'

jobs:
  # 测试门禁：构建/vet/测试全过才允许出镜像（坏提交拦在 master 之外）
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: webui

      # 前端类型检查同样是门禁：Vue 模板里的类型错误只有 vue-tsc 能抓到
      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: webui

      - name: Build frontend
        run: npm run build
        working-directory: webui

  # 多架构构建 + 推送 ghcr（推送与否由上面的 PUBLISH 开关决定）
  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git describe 要看得到 tag：默认浅克隆只有一个提交，算不出版本号
          fetch-depth: 0

      # 版本号 = git describe：打 tag 的构建是 v1.2.0，两版之间的 master 构建是 v1.2.0-3-gabc1234。
      # 界面显示它，更新检测拿它和最新 Release 比（internal/api/update.go）；还没打过 tag 时退回短提交号
      - name: Compute version
        run: |
          echo "APP_VERSION=$(git describe --tags --match 'v*' --always)" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner name
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # GITHUB_TOKEN 配合 job 的 packages: write 就够推 ghcr，不需要自建 PAT
      # （用自定义 secret 的话，别人 fork 本仓库后这个 job 必红）
      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 打 v* tag 时建 GitHub Release（更新说明按上一个 tag 以来的提交自动生成）。
  # 界面的更新检测读的就是 releases/latest，所以发版 = 推一个 tag，不用再去网页上手点。
  # 排在 docker 之后：Release 出现时镜像已经能拉，用户照提示 pull 不会扑空
  release:
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 版本号按日期写：v26.10.9，同一天再发 v26.10.9-2、-3……，序号版也是正式版，照常推给用户。
          # 只有 - 后面带字母的（v26.10.9-rc1）才按预发布发，不会被当成 latest。
          # 与 update.go 的 parseVersion 同口径，改一边要改另一边
          pre=""
          case "${GITHUB_REF_NAME}" in
            *-*[!0-9]*) pre="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag $pre
