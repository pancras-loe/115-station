name: Build Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: 115-station
  # 是否把镜像推到 ghcr。false 时 docker job 只验证多架构构建能过，不产出可拉取的包。
  #
  # 上游 DaisyYijin/STRMhub 未附带 LICENSE，镜像内含其代码，同样适用该状况——
  # 说明写在 README「许可证与再分发声明」一节，本仓库不对镜像作出任何授权声明。
  PUBLISH: 'true'

jobs:
  # 测试门禁：构建/vet/测试全过才允许出镜像（坏提交拦在 master 之外）
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: webui

      # 前端类型检查同样是门禁：Vue 模板里的类型错误只有 vue-tsc 能抓到
      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: webui

      - name: Build frontend
        run: npm run build
        working-directory: webui

  # 多架构构建 + 推送 ghcr（推送与否由上面的 PUBLISH 开关决定）
  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner name
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # GITHUB_TOKEN 配合 job 的 packages: write 就够推 ghcr，不需要自建 PAT
      # （用自定义 secret 的话，别人 fork 本仓库后这个 job 必红）
      - name: Login to GitHub Container Registry
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' && github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
